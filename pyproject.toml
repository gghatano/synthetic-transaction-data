[project]
name = "transyn"
version = "0.1.0"
description = "トランザクションデータ合成手法の調査・追試"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "sdv>=1.15",
    "torch>=2.2",
    "gretel-synthetics>=0.22",
    "tabulate>=0.10.0",
    "markdown>=3.11",
]

[project.scripts]
transyn = "transyn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# gretel-synthetics は sentencepiece==0.1.97, numpy<1.24, rdt<1.3 などの古い版に固定しており、
# Python 3.12 や現行の SDV と同居できない。使うのは DGAN（timeseries_dgan, PyTorch 実装）だけで、
# これらの固定は主に DGAN 以外の機能（テキスト生成、ACTGAN）のためなので、上書きして現行版に揃える。
# category-encoders 2.2.2 は pandas 2 以降で削除された API を使っており、DGAN の前処理で落ちる。
override-dependencies = [
    "sentencepiece>=0.2.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "rdt>=1.12",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "category-encoders>=2.6",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
